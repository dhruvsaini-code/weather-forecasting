name: CI Pipeline & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint and Syntax Check
      run: |
        python -m py_compile milestone1_pipeline.py report_generator.py

    - name: Run Milestone 1 Pipeline (Headless)
      run: |
        python milestone1_pipeline.py --headless

    - name: Validate Deliverables Existence
      run: |
        test -f milestone1_output/Milestone1_Synopsis.pptx
        test -f milestone1_output/figures/00_overview_dashboard.png
        test -f milestone1_output/index.html
        test -f index.html
        test -f milestone1_output/stats.json
        test -f milestone1_output/daily_series.csv
        echo "All Milestone 1 deliverables generated and verified successfully!"
